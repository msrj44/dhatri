<!DOCTYPE html><html lang="hi"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Popups — Dhatri Admin</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../logo.png" />
<link rel="stylesheet" href="admin.css" />
</head><body>
<header class="admin-header"><h1>🛠️ Dhatri <span>Admin</span></h1><div class="user-info">👤 <strong id="user-email">...</strong></div><button id="logout-btn">Logout</button></header>
<div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar"></aside>
  <main class="admin-main">
    <h2>📢 Popup Editor</h2>
    <div class="admin-card">
      <div class="form-row"><label><input type="checkbox" id="popup-active" /> Popup सक्रिय करें</label></div>
      <div class="form-row"><label>Title</label><input id="popup-title" /></div>
      <div class="form-row"><label>Message</label><textarea id="popup-message" rows="3"></textarea></div>
      <div class="form-row"><label>Image URL (optional)</label><input id="popup-image" /></div>
      <button id="save-btn" class="btn">💾 सेव</button><span id="msg" style="margin-left:1rem;font-weight:600;"></span>
    </div>
  </main>
</div>
<script type="module" src="js/admin-core.js"></script>
<script type="module" src="js/popups.js"></script>
</body></html>
