<!DOCTYPE html><html lang="hi"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Editor — Dhatri Admin</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../logo.png" />
<link rel="stylesheet" href="admin.css" />
</head><body>
<header class="admin-header"><h1>🛠️ Dhatri <span>Admin</span></h1><div class="user-info">👤 <strong id="user-email">...</strong></div><button id="logout-btn">Logout</button></header>
<div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar"></aside>
  <main class="admin-main">
    <h2>📞 Contact Editor</h2>
    <div class="admin-card">
      <div class="form-row"><label>Contact Email</label><input id="contact-email" placeholder="info@dhaatri.mywire.org" /></div>
      <button id="save-btn" class="btn">💾 सेव</button><span id="msg" style="margin-left:1rem;font-weight:600;"></span>
    </div>
    <div class="admin-card">
      <h3>📨 Contact Messages</h3>
      <table class="admin-table">
        <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Action</th></tr></thead>
        <tbody id="messages-body"></tbody>
      </table>
    </div>
  </main>
</div>
<script type="module" src="js/admin-core.js"></script>
<script type="module" src="js/contact.js"></script>
</body></html>
