<!DOCTYPE html><html lang="hi"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Editor — Dhatri Admin</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../logo.png" />
<link rel="stylesheet" href="admin.css" />
</head><body>
<header class="admin-header"><h1>🛠️ Dhatri <span>Admin</span></h1><div class="user-info">👤 <strong id="user-email">...</strong></div><button id="logout-btn">Logout</button></header>
<div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar"></aside>
  <main class="admin-main">
    <h2>📖 About Editor</h2>
    <div class="admin-card">
      <h3>गाँव का इतिहास</h3>
      <div class="form-row"><label>History</label><textarea id="about-history" rows="6" placeholder="धात्री गाँव का इतिहास..."></textarea></div>
      <div class="form-row"><label>Extra Info</label><textarea id="about-extra" rows="4"></textarea></div>
      <button id="save-btn" class="btn">💾 सेव</button><span id="msg" style="margin-left:1rem;font-weight:600;"></span>
    </div>
  </main>
</div>
<script type="module" src="js/admin-core.js"></script>
<script type="module" src="js/about.js"></script>
</body></html>
