<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home Editor — Dhatri Admin</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../logo.png" />
<link rel="stylesheet" href="admin.css" />
</head><body>
<header class="admin-header">
  <h1>🛠️ Dhatri <span>Admin Panel</span></h1>
  <div class="user-info">👤 <strong id="user-email">...</strong></div>
  <button id="logout-btn">Logout</button>
</header>
<div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar"></aside>
  <main class="admin-main">
    <h2>🏠 Home Page Editor</h2>
    <div class="admin-card">
      <h3>Hero Section</h3>
      <div class="form-row"><label>Hero Title</label><input id="home-title" placeholder="धात्री गाँव में स्वागत है" /></div>
      <div class="form-row"><label>Hero Intro</label><textarea id="home-intro" rows="3"></textarea></div>
      <button id="save-btn" class="btn">💾 सेव करें</button>
      <span id="msg" style="margin-left:1rem;font-weight:600;"></span>
    </div>
  </main>
</div>
<script type="module" src="js/admin-core.js"></script>
<script type="module" src="js/home.js"></script>
</body></html>
