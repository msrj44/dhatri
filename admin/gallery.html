<!DOCTYPE html><html lang="hi"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery Editor — Dhatri Admin</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../logo.png" />
<link rel="stylesheet" href="admin.css" />
</head><body>
<header class="admin-header"><h1>🛠️ Dhatri <span>Admin</span></h1><div class="user-info">👤 <strong id="user-email">...</strong></div><button id="logout-btn">Logout</button></header>
<div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar"></aside>
  <main class="admin-main">
    <h2>📸 Gallery Editor</h2>
    <div class="admin-card">
      <h3>फोटो अपलोड करें</h3>
      <div class="form-row"><label>फोटो चुनें</label><input type="file" id="gallery-file" accept="image/*" /></div>
      <div class="form-row"><label>Caption (optional)</label><input id="gallery-caption" placeholder="जैसे: तेजाजी मंदिर" /></div>
      <button id="upload-btn" class="btn">☁️ अपलोड</button>
      <span id="msg" style="margin-left:1rem;font-weight:600;"></span>
    </div>
    <div class="admin-card">
      <h3>सभी फोटो</h3>
      <div id="admin-gallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;"></div>
    </div>
  </main>
</div>
<script type="module" src="js/admin-core.js"></script>
<script type="module" src="js/gallery.js"></script>
</body></html>
