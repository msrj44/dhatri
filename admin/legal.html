<!DOCTYPE html><html lang="hi"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Legal — Dhatri Admin</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../logo.png" />
<link rel="stylesheet" href="admin.css" />
</head><body>
<header class="admin-header"><h1>🛠️ Dhatri <span>Admin</span></h1><div class="user-info">👤 <strong id="user-email">...</strong></div><button id="logout-btn">Logout</button></header>
<div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar"></aside>
  <main class="admin-main">
    <h2>📄 Legal Pages Editor</h2>
    <div class="admin-card">
      <h3>🔒 Privacy Policy</h3>
      <textarea id="privacy" rows="6" style="width:100%;padding:0.6rem;border:1px solid #dee2e6;border-radius:6px;"></textarea>
    </div>
    <div class="admin-card">
      <h3>📜 Terms & Conditions</h3>
      <textarea id="terms" rows="6" style="width:100%;padding:0.6rem;border:1px solid #dee2e6;border-radius:6px;"></textarea>
    </div>
    <div class="admin-card">
      <h3>⚠️ Disclaimer</h3>
      <textarea id="disclaimer" rows="6" style="width:100%;padding:0.6rem;border:1px solid #dee2e6;border-radius:6px;"></textarea>
    </div>
    <button id="save-btn" class="btn">💾 सभी सेव करें</button>
    <span id="msg" style="margin-left:1rem;font-weight:600;"></span>
  </main>
</div>
<script type="module" src="js/admin-core.js"></script>
<script type="module" src="js/legal.js"></script>
</body></html>
