<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Themes — Dhatri Admin</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="apple-touch-icon" href="../logo.png" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
<header class="admin-header">
  <h1>🛠️ Dhatri <span>Admin</span></h1>
  <div class="user-info">👤 <strong id="user-email">...</strong></div>
  <button id="logout-btn">Logout</button>
</header>
<div id="sidebar"></div>

<main class="admin-main">
  <h2>🎨 Theme Customizer</h2>
  <p class="admin-subtitle">Puri website ka theme yahan se control hota hai. Change karo → turant site pe apply hoga.</p>

  <div class="admin-card" style="margin-bottom:1.5rem;">
    <h3 style="margin-bottom:0.5rem;">Active theme: <span id="active-theme-name" style="color:var(--accent);">Default</span></h3>
  </div>

  <h3 style="color:var(--primary); margin-bottom:1rem;">Preset Themes</h3>
  <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1rem; margin-bottom:2rem;" id="presets-grid">
    <!-- Preset cards यहाँ JS से आएंगे -->
  </div>

  <h3 style="color:var(--primary); margin-bottom:1rem;">Custom Colors</h3>
  <div class="admin-card">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.5rem;">
      <div class="form-row"><label>Primary</label><input type="color" id="c-primary" style="width:100%; height:50px; padding:0.2rem;" /></div>
      <div class="form-row"><label>Accent</label><input type="color" id="c-accent" style="width:100%; height:50px; padding:0.2rem;" /></div>
      <div class="form-row"><label>Background</label><input type="color" id="c-bg" style="width:100%; height:50px; padding:0.2rem;" /></div>
      <div class="form-row"><label>Text</label><input type="color" id="c-text" style="width:100%; height:50px; padding:0.2rem;" /></div>
    </div>
    <div style="display:flex; gap:1rem;">
      <button id="apply-custom-btn" class="btn">🎨 Apply Custom Theme</button>
      <button id="reset-btn" class="btn btn-primary" style="background:#e2e8f0; color:#475569;">🔄 Reset to Default</button>
    </div>
    <span id="msg" style="margin-left:1rem; font-weight:600;"></span>
  </div>
</main>

<script type="module" src="js/admin-core.js"></script>
<script type="module" src="js/themes.js"></script>
</body>
</html>
