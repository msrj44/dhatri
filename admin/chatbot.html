<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../logo.png" />
<link rel="apple-touch-icon" href="../logo.png" />
<title>Chatbot — Dhatri Admin</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="apple-touch-icon" href="../logo.png" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
<header class="admin-header">
  <h1>🛠️ Dhatri <span>Admin</span></h1>
  <div class="user-info">👤 <strong id="user-email">...</strong></div>
  <button id="logout-btn">Logout</button>
</header>
<div id="sidebar"></div>

<main class="admin-main">
  <h2>🤖 Chatbot Editor</h2>
  <p class="admin-subtitle">"धात्री मित्र" चैटबॉट को ON/OFF करें और सवाल-जवाब सेट करें।</p>

  <div class="admin-card">
    <h3>Status</h3>
    <label><input type="checkbox" id="cb-enabled" /> चैटबॉट चालू करें</label>
    <button id="cb-toggle-btn" class="btn" style="margin-left:1rem;">💾 अपडेट</button>
    <span id="cb-msg" style="margin-left:1rem; font-weight:600;"></span>
  </div>

  <div class="admin-card">
    <h3>नया Rule जोड़ें</h3>
    <div class="form-row"><label>Keywords (comma separated)</label><input id="cb-keywords" placeholder="जनसंख्या, population, people" /></div>
    <div class="form-row"><label>Reply</label><textarea id="cb-reply" rows="2"></textarea></div>
    <button id="cb-add-rule" class="btn">➕ जोड़ें</button>
  </div>

  <div class="admin-card">
    <h3>सभी Rules</h3>
    <table class="admin-table">
      <thead><tr><th>Keywords</th><th>Reply</th><th>Action</th></tr></thead>
      <tbody id="cb-rules-body"></tbody>
    </table>
  </div>
</main>

<script type="module" src="js/admin-core.js"></script>
<script type="module" src="js/chatbot.js"></script>
</body>
</html>
